name: Entrainement continu (pilote)

# Toutes les heures : juge les reseaux candidats de l'entrainement continu
# (pre-releases candidat-K) par un match au temps contre le dernier reseau
# adopte, et publie la release reseau-K s'il gagne. Voir ci/hebdo_pilote.sh.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hebdo
  cancel-in-progress: false

jobs:
  piloter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ovnice-dev/onechess
          path: moteur
      - name: moteur (depot onechess)
        run: |
          # Les tests vivent dans onechess-tools ; le moteur et son reseau par defaut
          # viennent du depot onechess.
          cp -r moteur/engine .
          mkdir -p reseau && cp moteur/reseau/onechess.nnue reseau/
          rm -rf moteur
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install chess
      - name: piloter
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TOKEN: ${{ secrets.ONECHESS_TOKEN }}
          REPO: ${{ github.repository }}
          HEBDO_X: ${{ vars.HEBDO_X }}
        run: bash ci/hebdo_pilote.sh
